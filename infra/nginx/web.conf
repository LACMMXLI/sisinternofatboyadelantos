# Configuración de referencia para el contenedor del frontend.
# Estrategia de mismo origen (§16): este mismo host sirve el SPA y reenvía
# /api al contenedor de la API dentro de la red interna de Docker/Coolify.
# El nombre "api" debe coincidir con el nombre del servicio en Coolify.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 512;

    # Activos con hash: cacheables por mucho tiempo.
    location ~* \.(?:js|css|woff2?|svg|png|jpg|jpeg|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html nunca se cachea (referencia siempre los assets vigentes).
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Reenvío a la API. Ajusta "api:3000" al nombre/puerto real del servicio.
    location /api/ {
        proxy_pass http://api:3000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA: cualquier ruta desconocida cae en index.html (React Router).
    location / {
        try_files $uri /index.html;
    }
}
