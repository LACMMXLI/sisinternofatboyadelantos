<!DOCTYPE html>

<html class="dark" lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Confirmación de Registro - Libreta Digital</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&amp;family=Work+Sans:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-bright": "#31394d",
                        "on-primary-fixed-variant": "#920028",
                        "surface-variant": "#2d3449",
                        "surface-container-lowest": "#060e20",
                        "on-tertiary-container": "#f9fbfd",
                        "primary-fixed-dim": "#ffb3b6",
                        "error": "#ffb4ab",
                        "tertiary-fixed": "#e0e3e5",
                        "secondary-fixed-dim": "#b9c7e0",
                        "on-primary-fixed": "#40000c",
                        "surface-container-low": "#131b2e",
                        "on-error-container": "#ffdad6",
                        "on-secondary-fixed": "#0d1c2f",
                        "on-primary-container": "#fffaf9",
                        "surface": "#0b1326",
                        "secondary": "#b9c7e0",
                        "on-primary": "#68001a",
                        "inverse-primary": "#be0037",
                        "primary": "#ffb3b6",
                        "on-background": "#dae2fd",
                        "outline-variant": "#5c3f40",
                        "surface-container-high": "#222a3d",
                        "primary-fixed": "#ffdada",
                        "on-tertiary-fixed": "#191c1e",
                        "secondary-container": "#3c4a5e",
                        "on-secondary-container": "#abb9d2",
                        "surface-container": "#171f33",
                        "on-surface-variant": "#e5bdbe",
                        "on-error": "#690005",
                        "on-secondary": "#233144",
                        "surface-tint": "#ffb3b6",
                        "tertiary": "#c4c7c9",
                        "on-tertiary": "#2d3133",
                        "tertiary-fixed-dim": "#c4c7c9",
                        "outline": "#ac8889",
                        "surface-dim": "#0b1326",
                        "on-secondary-fixed-variant": "#3a485c",
                        "on-tertiary-fixed-variant": "#444749",
                        "tertiary-container": "#717476",
                        "background": "#0b1326",
                        "primary-container": "#e11d48",
                        "inverse-on-surface": "#283044",
                        "surface-container-highest": "#2d3449",
                        "error-container": "#93000a",
                        "on-surface": "#dae2fd",
                        "secondary-fixed": "#d5e3fd",
                        "inverse-surface": "#dae2fd"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "base": "8px",
                        "sm": "12px",
                        "xs": "4px",
                        "md": "24px",
                        "gutter": "24px",
                        "margin-desktop": "64px",
                        "margin-mobile": "16px",
                        "lg": "48px",
                        "xl": "80px"
                    },
                    "fontFamily": {
                        "display-lg": ["Manrope", "sans-serif"],
                        "body-md": ["Work Sans", "sans-serif"],
                        "body-lg": ["Work Sans", "sans-serif"],
                        "label-sm": ["JetBrains Mono", "monospace"],
                        "headline-lg-mobile": ["Manrope", "sans-serif"],
                        "headline-md": ["Manrope", "sans-serif"],
                        "label-md": ["JetBrains Mono", "monospace"],
                        "headline-lg": ["Manrope", "sans-serif"]
                    },
                    "fontSize": {
                        "display-lg": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "800" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
                        "label-sm": ["12px", { "lineHeight": "16px", "fontWeight": "500" }],
                        "headline-lg-mobile": ["24px", { "lineHeight": "32px", "fontWeight": "700" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "label-md": ["14px", { "lineHeight": "20px", "letterSpacing": "0.02em", "fontWeight": "500" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "700" }]
                    }
                }
            }
        }
    </script>
<style>
        .pulse-bubble {
            animation: pulse-soft 2s infinite;
        }
        @keyframes pulse-soft {
            0%, 100% { transform: scale(1) translateY(0); opacity: 1; }
            50% { transform: scale(1.02) translateY(-4px); opacity: 0.9; }
        }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen font-body-md antialiased overflow-hidden flex items-center justify-center">
<!-- Overlay / Backdrop -->
<div class="fixed inset-0 bg-surface-container-lowest/80 backdrop-blur-sm z-40 transition-opacity"></div>
<!-- Modal Container -->
<main class="relative z-50 w-full max-w-[840px] px-margin-mobile md:px-0">
<!-- Modal Card -->
<div class="bg-surface-container border border-surface-variant rounded-xl shadow-[0_8px_32px_rgba(0,0,0,0.4)] overflow-hidden relative max-w-md mx-auto">
<!-- Header Section -->
<div class="p-gutter border-b border-surface-variant flex flex-col items-center justify-center text-center bg-surface-container-high/50">
<span class="material-symbols-outlined text-primary-container text-[48px] mb-base" style="font-variation-settings: 'FILL' 1;">
                    payments
                </span>
<h1 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-on-surface mb-xs">
                    Carlos: Adelanto $500
                </h1>
<p class="font-body-md text-body-md text-on-surface-variant">
                    ¿Registrar este movimiento?
                </p>
</div>
<!-- Details Section (Optional/Minimal) -->
<div class="p-gutter bg-surface">
<div class="flex justify-between items-center py-sm border-b border-surface-variant">
<span class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider">Empleado</span>
<span class="font-body-md text-body-md font-medium text-on-surface">Carlos</span>
</div>
<div class="flex justify-between items-center py-sm border-b border-surface-variant">
<span class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider">Tipo</span>
<span class="font-body-md text-body-md font-medium text-on-surface">Adelanto</span>
</div>
<div class="flex justify-between items-center py-sm">
<span class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider">Monto</span>
<span class="font-headline-md text-headline-md text-primary-fixed-dim">$500.00</span>
</div>
</div>
<!-- Actions Section -->
<div class="p-gutter flex flex-col gap-sm bg-surface-container-lowest relative mt-lg">
<!-- Interactive Guide Bubble -->
<div class="absolute -top-14 left-1/2 -translate-x-1/2 pulse-bubble z-10 w-[90%] max-w-[300px]">
<div class="bg-surface-tint text-surface-container-lowest font-label-sm text-label-sm px-sm py-base rounded-lg shadow-lg relative text-center font-bold">
                        Verifica los datos antes de confirmar el registro
                        <!-- Bubble Tail -->
<div class="absolute -bottom-2 left-1/2 -translate-x-1/2 w-0 h-0 border-l-[8px] border-l-transparent border-r-[8px] border-r-transparent border-t-[8px] border-t-surface-tint"></div>
</div>
</div>
<button class="w-full bg-primary-container text-on-primary-container font-headline-md text-headline-md py-md rounded-lg flex items-center justify-center gap-xs hover:bg-inverse-primary transition-colors duration-200 shadow-[inset_0_1px_0_rgba(255,255,255,0.1)] group">
<span class="material-symbols-outlined transition-transform group-hover:scale-110" style="font-variation-settings: 'FILL' 1;">
                        check_circle
                    </span>
                    Confirmar
                </button>
<button class="w-full bg-surface-container-high border border-outline-variant text-on-surface font-headline-md text-headline-md py-md rounded-lg flex items-center justify-center gap-xs hover:bg-surface-variant transition-colors duration-200">
<span class="material-symbols-outlined text-on-surface-variant">
                        cancel
                    </span>
                    Cancelar
                </button>
</div>
</div>
</main>
</body></html>
