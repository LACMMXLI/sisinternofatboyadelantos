<style>
        .numpad-btn {
            transition: all 0.2s ease;
        }
        .numpad-btn:active {
            transform: scale(0.95);
            background-color: theme('colors.surface-container-high');
        }
        .guide-bubble {
            animation: pulse-border 2s infinite;
        }
        @keyframes pulse-border {
            0% { box-shadow: 0 0 0 0 rgba(234, 179, 8, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(234, 179, 8, 0); }
            100% { box-shadow: 0 0 0 0 rgba(234, 179, 8, 0); }
        }
        .tooltip-arrow::after {
            content: '';
            position: absolute;
            border-style: solid;
        }
        .tooltip-top::after {
            top: 100%;
            left: 50%;
            transform: translateX(-50%);
            border-width: 8px 8px 0;
            border-color: #ca8a04 transparent transparent transparent;
        }
        .tooltip-bottom::after {
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%);
            border-width: 0 8px 8px;
            border-color: transparent transparent #ca8a04 transparent;
        }
    </style>

<body class="bg-surface dark:bg-surface-dim text-on-surface min-h-screen flex flex-col font-body-md overflow-hidden antialiased">

<a class="text-on-surface-variant font-medium hover:scale-102 transition-transform duration-200" href="#">Activity</a>
</nav>
<div class="flex gap-4">
<span class="material-symbols-outlined text-on-surface hover:text-primary cursor-pointer transition-colors" data-icon="location_on">location_on</span>
<span class="material-symbols-outlined text-on-surface hover:text-primary cursor-pointer transition-colors" data-icon="account_circle">account_circle</span>
</div>
</div>
</div>

                Adelanto
            </button>
<button class="bg-surface-container-high border border-outline-variant text-on-surface font-headline-md text-headline-md px-8 py-4 rounded-xl hover:bg-surface-container-highest transition-all flex items-center gap-2">

            </button>

<!-- Amount Display Area with Interactive Guide -->

<div class="relative inline-block">

                </div>
<div class="font-display-lg text-8xl text-primary font-bold tracking-tight py-4 border-b-2 border-surface-container-highest flex items-center justify-center gap-2" id="amountDisplay">

</div>
</div>

<script>
        // Simple script to dismiss tooltips on interaction
        document.addEventListener('click', function(e) {
            const bubbles = document.querySelectorAll('.guide-bubble');
            bubbles.forEach(bubble => {
                bubble.style.opacity = '0';
                bubble.style.transition = 'opacity 0.5s ease';
                setTimeout(() => bubble.remove(), 500);
            });
        }, { once: true });
    </script>
