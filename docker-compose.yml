name: libreta-de-nominas

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-libreta}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-libreta_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-libreta_nominas}
    ports:
      # Puerto host 5433 por defecto para no chocar con un PostgreSQL nativo
      # en 5432. Ajusta POSTGRES_PORT si prefieres otro mapeo.
      - '${POSTGRES_PORT:-5433}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-libreta}']
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-libreta_minio}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-libreta_minio_dev_secret}
    ports:
      - '${MINIO_PORT:-9000}:9000'
      - '${MINIO_CONSOLE_PORT:-9001}:9001'
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  minio_data:
