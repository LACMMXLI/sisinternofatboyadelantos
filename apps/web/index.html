<!doctype html>
<html lang="es-MX">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0A46B6" />
    <meta
      name="description"
      content="Libreta de Nóminas: registro digital de adelantos, consumos y descuentos de empleados."
    />
    <title>Libreta de Nóminas</title>
    <script>
      // Aplica el tema guardado (o la preferencia del sistema) antes del primer
      // paint para evitar parpadeo claro→oscuro. Debe leer la misma llave que
      // ThemeProvider (apps/web/src/app/providers/ThemeProvider.tsx).
      (function () {
        try {
          var stored = localStorage.getItem('libreta-theme');
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          document.documentElement.dataset.theme = theme;
        } catch (e) {
          /* localStorage inaccesible (modo privado estricto): se queda en claro. */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
